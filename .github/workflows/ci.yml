name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: "${{ matrix.platform.os }}-latest"
    strategy:
      matrix:
        platform:
          [
            { os: "windows", target: "x86_64-pc-windows-msvc" },
            { os: "windows", target: "i686-pc-windows-msvc" },
            { os: "ubuntu", target: "x86_64-unknown-linux-gnu" },
            { os: "ubuntu", target: "i686-unknown-linux-gnu" },
            { os: "ubuntu", target: "wasm32-unknown-unknown" },
            { os: "macos", target: "aarch64-apple-darwin" },
          ]
    steps:
      - uses: actions/checkout@v4
      - name: Cache .cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ./target
          key: ${{ runner.os }}-cargo-${{ matrix.platform.target }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.platform.target }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
      - name: Install test runner for wasm
        if: matrix.platform.target == 'wasm32-unknown-unknown'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Stable Build with all features
        run: cargo build --all-features --target ${{ matrix.platform.target }}
      - name: Stable Build without features
        run: cargo build --target ${{ matrix.platform.target }}
      - name: Tests
        if: matrix.platform.target == 'x86_64-unknown-linux-gnu' || matrix.platform.target == 'x86_64-pc-windows-msvc' || matrix.platform.target == 'aarch64-apple-darwin'
        run: cargo test --all-features
      - name: Tests in WASM
        if: matrix.platform.target == 'wasm32-unknown-unknown'
        run: wasm-pack test --node -- --all-features
  
  check_features:
    runs-on: "${{ matrix.platform.os }}-latest"
    strategy:
      matrix:
        platform: [{ os: "ubuntu" }]
        features:
          - "--features serde"
          - "--features datasets"
          - "--features ndarray-bindings"
          - "--features std,ndarray-bindings"
          - ""
    steps:
      - uses: actions/checkout@v4
      - name: Cache .cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ./target
          key: ${{ runner.os }}-cargo-features-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-features
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Stable Build
        run: cargo build --no-default-features ${{ matrix.features }}
      - name: Assert ndarray feature resolution
        shell: bash
        run: |
          case "${{ matrix.features }}" in
            "--features ndarray-bindings")
              ci/check-ndarray-features.sh no-std --no-default-features ${{ matrix.features }}
              ;;
            "--features std,ndarray-bindings")
              ci/check-ndarray-features.sh std --no-default-features ${{ matrix.features }}
              ;;
            "")
              ci/check-ndarray-features.sh absent --no-default-features
              # Default features and explicit std must not activate ndarray.
              ci/check-ndarray-features.sh absent
              ci/check-ndarray-features.sh absent --no-default-features --features std
              # Default plus bindings keeps ndarray's std feature on.
              ci/check-ndarray-features.sh std --features default,ndarray-bindings
              ;;
            *)
              ci/check-ndarray-features.sh absent --no-default-features ${{ matrix.features }}
              ;;
          esac
      - name: Tests
        if: matrix.features == '--features ndarray-bindings' || matrix.features == '--features std,ndarray-bindings'
        run: cargo test --no-default-features ${{ matrix.features }}
      - name: Explicit std does not activate ndarray
        if: matrix.features == ''
        run: cargo build --no-default-features --features std
      - name: Default plus ndarray-bindings
        if: matrix.features == ''
        run: |
          cargo build --features default,ndarray-bindings
          cargo test --features default,ndarray-bindings

  msrv:
    # Verify the declared rust-version (MSRV) in Cargo.toml still builds.
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache .cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ./target
          key: ${{ runner.os }}-msrv-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-msrv
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Build with all features at MSRV
        run: cargo +1.85.0 build --all-features
      - name: Build without features at MSRV
        run: cargo +1.85.0 build
