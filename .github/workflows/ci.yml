name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: "${{ matrix.platform.os }}-latest"
    strategy:
      matrix:
        platform:
          [
            { os: "windows", target: "x86_64-pc-windows-msvc" },
            { os: "windows", target: "i686-pc-windows-msvc" },
            { os: "ubuntu", target: "x86_64-unknown-linux-gnu" },
            { os: "ubuntu", target: "i686-unknown-linux-gnu" },
            { os: "ubuntu", target: "wasm32-unknown-unknown" },
            { os: "macos", target: "aarch64-apple-darwin" },
          ]
    steps:
      - uses: actions/checkout@v4
      - name: Cache .cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ./target
          key: ${{ runner.os }}-cargo-${{ matrix.platform.target }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.platform.target }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
      - name: Install test runner for wasm
        if: matrix.platform.target == 'wasm32-unknown-unknown'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Stable Build with all features
        run: cargo build --all-features --target ${{ matrix.platform.target }}
      - name: Stable Build without features
        run: cargo build --target ${{ matrix.platform.target }}
      - name: Tests
        if: matrix.platform.target == 'x86_64-unknown-linux-gnu' || matrix.platform.target == 'x86_64-pc-windows-msvc' || matrix.platform.target == 'aarch64-apple-darwin'
        run: cargo test --all-features
      - name: Tests in WASM
        if: matrix.platform.target == 'wasm32-unknown-unknown'
        run: wasm-pack test --node -- --all-features
  
  check_features:
    runs-on: "${{ matrix.platform.os }}-latest"
    strategy:
      matrix:
        platform: [{ os: "ubuntu" }]
        features:
          - "--features serde"
          - "--features datasets"
          - "--features ndarray-bindings"
          - "--features std,ndarray-bindings"
          - ""
    steps:
      - uses: actions/checkout@v4
      - name: Cache .cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ./target
          key: ${{ runner.os }}-cargo-features-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-features
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Stable Build
        run: cargo build --no-default-features ${{ matrix.features }}
      - name: Assert ndarray feature resolution
        shell: bash
        run: |
          set -euo pipefail

          # `cargo tree --edges normal,build` omits dev-dependency edges.
          # `{p} {f}` is "name version feat1,feat2". Match the ndarray package
          # name exactly and compare the comma-separated feature tokens to
          # "std" so a substring on another package cannot pass.
          assert_ndarray() {
            local expect="$1"
            shift
            local tree line features has_std token found
            # Assign separately so `local` cannot mask a failing `cargo tree`.
            tree="$(cargo tree --edges normal,build --prefix none --format '{p} {f}' "$@")"
            found=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              # Cargo appends " (*)" on repeated packages; it is not a feature.
              line="${line% (*)}"
              case "$line" in
                ndarray[[:space:]]*) ;;
                *) continue ;;
              esac
              found=1
              # Drop the package name and version; the rest is `{f}`.
              features="$(printf '%s\n' "$line" | awk '{ $1=""; $2=""; sub(/^[[:space:]]+/, ""); print }')"
              has_std=0
              if [ -n "$features" ]; then
                IFS=',' read -ra tokens <<< "$features"
                for token in "${tokens[@]}"; do
                  token="${token#"${token%%[![:space:]]*}"}"
                  token="${token%"${token##*[![:space:]]}"}"
                  if [ "$token" = "std" ]; then
                    has_std=1
                  fi
                done
              fi
              if [ "$expect" = "absent" ]; then
                echo "ndarray unexpectedly present in the normal/build graph: $line" >&2
                exit 1
              fi
              if [ "$expect" = "std" ] && [ "$has_std" -ne 1 ]; then
                echo "ndarray is missing the std feature token: $line" >&2
                exit 1
              fi
              if [ "$expect" = "no-std" ] && [ "$has_std" -ne 0 ]; then
                echo "ndarray unexpectedly enables std: $line" >&2
                exit 1
              fi
              echo "ndarray feature check passed ($expect): $line"
            done <<< "$tree"
            if [ "$found" -eq 0 ]; then
              if [ "$expect" = "absent" ]; then
                echo "ndarray is absent from the normal/build graph"
                return 0
              fi
              echo "expected ndarray package line is missing" >&2
              printf '%s\n' "$tree" >&2
              exit 1
            fi
          }

          case "${{ matrix.features }}" in
            "--features ndarray-bindings")
              assert_ndarray no-std --no-default-features ${{ matrix.features }}
              ;;
            "--features std,ndarray-bindings")
              assert_ndarray std --no-default-features ${{ matrix.features }}
              ;;
            "")
              assert_ndarray absent --no-default-features
              # Default features and explicit std must not activate ndarray.
              # This catches strong `ndarray/std` forwarding.
              assert_ndarray absent
              assert_ndarray absent --no-default-features --features std
              # Default plus bindings keeps ndarray's std feature on.
              assert_ndarray std --features default,ndarray-bindings
              ;;
            *)
              assert_ndarray absent --no-default-features ${{ matrix.features }}
              ;;
          esac
      - name: Tests
        if: matrix.features == '--features ndarray-bindings' || matrix.features == '--features std,ndarray-bindings'
        run: cargo test --no-default-features ${{ matrix.features }}
      - name: Explicit std does not activate ndarray
        if: matrix.features == ''
        run: cargo build --no-default-features --features std
      - name: Default plus ndarray-bindings
        if: matrix.features == ''
        run: |
          cargo build --features default,ndarray-bindings
          cargo test --features default,ndarray-bindings

  msrv:
    # Verify the declared rust-version (MSRV) in Cargo.toml still builds.
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache .cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ./target
          key: ${{ runner.os }}-msrv-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-msrv
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Build with all features at MSRV
        run: cargo +1.85.0 build --all-features
      - name: Build without features at MSRV
        run: cargo +1.85.0 build
