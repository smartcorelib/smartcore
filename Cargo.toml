[package]
name = "smartcore"
description = "Machine Learning in Rust."
homepage = "https://smartcorelib.github.io/"
version = "0.7.0"
authors = ["smartcore Developers"]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
documentation = "https://docs.rs/smartcore"
repository = "https://github.com/smartcorelib/smartcore"
readme = "README.md"
keywords = ["machine-learning", "statistical", "ai", "optimization", "linear-algebra"]
categories = ["science"]
exclude = [
    ".github",
    ".gitignore",
    "smartcore.iml",
    "smartcore.svg",
    "tests/",
    "AGENTS.md",
    "deny.toml"
]

[dependencies]
approx = "0.5.1"
cfg-if = "1.0.0"
lazymatrix = { version = "0.8.1", optional = true, default-features = false }
ndarray = { version = "0.17.2", optional = true, default-features = false }
num-traits = "0.2.12"
num = "0.4"
rand = { version = "0.10.2", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"], optional = true }
ordered-float = "5.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
typetag = { version = "0.2", optional = true }

[features]
# `std` stays on by default so ordinary builds keep ndarray's standard-library
# support when `ndarray-bindings` is enabled. Weak forwarding (`ndarray?/std`)
# does not activate the optional ndarray dependency by itself. `std` only
# controls ndarray's standard-library support; smartcore itself is not
# `no_std`. serde and rand stay opt-in, which keeps the default dependency set
# WASM-compatible.
default = ["std"]

# Enable ndarray's `std` feature when ndarray is already enabled.
# The `?` keeps `--features std` from pulling ndarray in on its own.
std = ["ndarray?/std"]

# Enable serde Serialize/Deserialize for models and related types.
# Also enables typetag on non-wasm targets for trait object serialization.
serde = ["dep:serde", "dep:typetag"]

# Optional bindings for the ndarray crate (DenseMatrix <-> ndarray).
ndarray-bindings = ["dep:ndarray"]

# Apply Lasso and Elastic Net normalization without copying the design matrix.
lazy-normalization = ["dep:lazymatrix"]

# Sample datasets (iris, boston, digits, ...) and dataset generators.
# Enables serde because datasets ship serialized bundles. Does not enable
# std_rand: the generators use the crate RNG (SmallRng without std_rand).
# Without std_rand, make_blobs/make_circles/make_moons use a fixed seed and give
# the same output for each call. Add std_rand for non-deterministic generators.
datasets = ["serde"]

# Use the standard library RNG (StdRng / thread_rng) instead of SmallRng.
# Required for non-deterministic seeding without an explicit seed.
std_rand = ["rand/std_rng", "rand/std", "rand/thread_rng"]

# Enable getrandom's wasm_js backend for wasm32-unknown-unknown (in-browser).
js = ["getrandom/wasm_js"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", optional = true }

[target.'cfg(all(target_arch = "wasm32", not(target_os = "wasi")))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
itertools = "0.15.0"
serde_json = "1.0"
postcard = { version = "1.1", features = ["use-std"] }

# proptest pulls in wait-timeout (Unix syscalls), which doesn't compile on
# wasm32. Gate it to non-wasm targets only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.5"

[workspace]

[profile.test]
debug = 1
opt-level = 3

[profile.release]
strip = true
lto = true
codegen-units = 1
overflow-checks = true

[lints.rust]
# Avoid unexpected_cfgs warnings (edition 2024) for the cfgs code/tests set.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(coverage, coverage_nightly)',
    'cfg(tarpaulin)',
] }
