# Configuration for cargo-deny.
# Documentation: https://embarkstudios.github.io/cargo-deny/
#
# Run locally with: cargo deny --all-features check

[graph]
all-features = true

[advisories]
# Fail if a dependency is yanked. A yanked version can have a known defect.
yanked = "deny"
ignore = [
    # `atomic-polyfill` is unmaintained. It enters the graph only through
    # `postcard` -> `heapless`, and `postcard` is a dev-dependency.
    # Remove this entry when `postcard` stops using `heapless` 0.7.
    { id = "RUSTSEC-2023-0089", reason = "Dev-dependency only (postcard -> heapless). Not in the published crate." },
]

[licenses]
# Licenses that dependencies can use. `smartcore` is Apache-2.0.
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]

[bans]
# Different versions of one crate are common in the tree. Show them, do not fail.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
